name: spec sync

# vendoring した公開契約バンドル（spec/v1/）を配信元と比べ、違っていれば新しい
# コピーで契約テストを回し、その結果を本文に書いた PR を出す。
#
# 差分検査と同期 PR を同じ job にしてある。取りに行く側なので、この repository の
# GITHUB_TOKEN だけで済む（private 側から public へ書き込む資格情報を持たない）。
#
# GITHUB_TOKEN が作った PR ではワークフローが起動しない（再帰防止）。だから PR を
# 出す前に、この job の中で契約テストを回して結果を本文に書く。main へは直接 push
# しない。契約が締まる方向に変わったら SDK のコードも直す必要があり、人が見る場所が要る。
#
# pull_request では回さない。fork からの PR は外部通信の前提が揃わないため。

on:
  schedule:
    # 平日 09:00 JST
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

concurrency:
  group: spec-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  SYNC_BRANCH: spec-sync

jobs:
  sync:
    name: 公開契約バンドルを同期
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: 配信元を取得して spec/v1 を更新
        id: sync
        run: |
          set -euo pipefail
          bun run spec:sync --report "$RUNNER_TEMP/spec-report.md"
          if git diff --quiet -- spec && [ -z "$(git ls-files --others --exclude-standard spec)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 新しいコピーで契約テストを回す
        id: contract
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        # shell: bash を明示すると -o pipefail が付く。既定の shell では tee の
        # 終了コードで上書きされ、テストの失敗が「通過」として本文に載ってしまう
        shell: bash
        run: bun run test:contract 2>&1 | tee "$RUNNER_TEMP/contract.log"

      - name: 同期 PR を作る・更新する
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add -A spec
          git commit -m "spec: 公開契約バンドルを配信元に合わせる" \
            -m "https://spec.monica.accelhack.net/v1/ を取得して spec/v1 を更新した。差分と契約テストの結果は PR 本文にある。"
          git push --force origin "$SYNC_BRANCH"

          {
            echo "配信元の公開契約バンドルが vendoring したコピーと違っていたので更新した。"
            echo
            cat "$RUNNER_TEMP/spec-report.md"
            echo
            if [ "$CONTRACT_OUTCOME" = "success" ]; then
              echo "## 契約テスト: 通過"
              echo
              echo "新しいコピーに対して \`bun run test:contract\` が通った。追加だけの変更ならそのまま merge できる。"
            else
              echo "## 契約テスト: 失敗"
              echo
              echo "新しいコピーに対して \`bun run test:contract\` が落ちた。契約が締まる方向に変わっている。SDK のコードをこの PR で直してから merge する。"
            fi
            echo
            echo "<details><summary>テストの出力</summary>"
            echo
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/contract.log"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "この PR は spec-sync.yml が作った。GITHUB_TOKEN が作った PR では ci が自動で起動しないので、上の結果を CI の代わりに読む。CI を回したいときは空 commit を push するか、close して re-open する。"
          } > "$RUNNER_TEMP/body.md"

          existing=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/body.md"
            echo "PR #$existing を更新した"
          else
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "spec: 公開契約バンドルを配信元に合わせる" \
              --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: 差分なし
        if: steps.sync.outputs.changed != 'true'
        run: echo "spec/v1 は配信元と一致している"
